<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyrox · Leaderboard en vivo</title>
<style>
  :root{
    --bg:#0a0c10; --surface:#13161d; --line:#262b35;
    --text:#f4f6fa; --muted:#9aa3b2; --hint:#666e7e;
    --accent:#1d9e75; --gold:#f5c451; --silver:#cdd3dd; --bronze:#d9915a;
    --blue:#5da3e8; --amber:#f5b54a;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%}
  body{padding:2.2vmin 3vmin;display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.8vmin;border-bottom:2px solid var(--line);margin-bottom:1.6vmin}
  .brand{display:flex;align-items:center;gap:1.4vmin;font-weight:800;font-size:3.4vmin;letter-spacing:.18em}
  .brand .dot{width:1.6vmin;height:1.6vmin;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .meta{text-align:right;font-size:1.7vmin;color:var(--muted);line-height:1.5}
  .live{display:inline-flex;align-items:center;gap:.7vmin;color:var(--accent);font-weight:700}
  .live .blink{width:1.1vmin;height:1.1vmin;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  table{width:100%;border-collapse:collapse;font-size:2.4vmin}
  thead th{text-align:left;color:var(--hint);font-size:1.6vmin;text-transform:uppercase;letter-spacing:.12em;padding:0 1.4vmin 1.2vmin;font-weight:700}
  thead th.num{text-align:right}
  tbody tr{background:var(--surface);transition:transform .4s ease}
  tbody td{padding:1.9vmin 1.4vmin;border-bottom:6px solid var(--bg);font-variant-numeric:tabular-nums}
  tbody tr td:first-child{border-radius:10px 0 0 10px}
  tbody tr td:last-child{border-radius:0 10px 10px 0;text-align:right}
  .pos{font-family:var(--mono);font-weight:800;font-size:3vmin;width:7vmin;color:var(--muted)}
  .p1 .pos{color:var(--gold)} .p2 .pos{color:var(--silver)} .p3 .pos{color:var(--bronze)}
  .p1{outline:2px solid rgba(245,196,81,.5)} 
  .nm{font-weight:700;font-size:2.7vmin}
  .bib{font-family:var(--mono);color:var(--accent);font-weight:700;margin-right:1vmin}
  .cat{display:inline-block;font-size:1.5vmin;color:var(--muted);background:rgba(255,255,255,.06);padding:.3vmin 1vmin;border-radius:999px;margin-left:1vmin;vertical-align:middle}
  .total{font-family:var(--mono);font-weight:800;font-size:3vmin}
  .split{font-family:var(--mono);color:var(--muted);font-size:1.9vmin}
  .split .lbl{color:var(--hint);font-size:1.3vmin;display:block}
  .running .total{color:var(--amber)}
  .badge-run{display:inline-block;font-size:1.4vmin;color:var(--amber);background:rgba(245,181,74,.14);padding:.3vmin 1vmin;border-radius:999px}
  .badge-fin{display:inline-block;font-size:1.4vmin;color:var(--accent);background:rgba(29,158,117,.16);padding:.3vmin 1vmin;border-radius:999px}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--hint);gap:2vmin;text-align:center}
  .empty .big{font-size:4vmin;font-weight:700;color:var(--muted)}
  footer{margin-top:auto;padding-top:1.6vmin;color:var(--hint);font-size:1.5vmin;display:flex;justify-content:space-between;border-top:1px solid var(--line)}
  .setup{max-width:560px;margin:8vmin auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4vmin}
  .setup h1{font-size:3vmin;margin-bottom:1.5vmin}
  .setup p{color:var(--muted);font-size:2vmin;line-height:1.6;margin-bottom:1.5vmin}
  .setup code{background:#000;padding:.2vmin 1vmin;border-radius:5px;font-family:var(--mono);color:#9fe1cb;font-size:1.7vmin}
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js"></script>
<script type="module">
/* ===========================================================================
   Las credenciales se leen del archivo externo config.js (window.firebaseConfig).
   No se escriben aquí. Crea config.js una vez junto a este archivo.
   =========================================================================== */
const firebaseConfig = (window.firebaseConfig) ? window.firebaseConfig : {
  apiKey: "PEGA_TU_API_KEY"
};
/* ===========================================================================
   Código de sesión: debe coincidir con el de la app de cronometraje.
   Puedes cambiarlo aquí, o pasarlo por la URL:  leaderboard.html?s=sabado-15-jun
   =========================================================================== */
const params=new URLSearchParams(location.search);
const SESSION = params.get("s") || "sabado";
/* =========================================================================== */

const CONFIGURED=!firebaseConfig.apiKey.startsWith("PEGA_");
const STATIONS=["SkiErg 1000m","Sled Push 50m","Sled Pull 50m","Burpee Broad Jump 80m","Rowing 1000m","Farmers Carry 200m","Sandbag Lunges 100m","Wall Balls x100"];

function fmt(ms){ if(ms==null)return"—"; const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60; return (h>0?h+":":"")+String(m).padStart(h>0?2:1,"0")+":"+String(s).padStart(2,"0"); }
function fmtShort(ms){ if(ms==null)return"—"; const t=Math.floor(ms/1000),m=Math.floor(t/60),s=t%60; return m+":"+String(s).padStart(2,"0"); }
function totalMs(a){ return a.steps.reduce((s,x)=>s+(x.ms||0),0); }
function runMs(a){ return a.steps.filter(x=>x.type==="run").reduce((s,x)=>s+(x.ms||0),0); }
function stationMs(a){ return a.steps.filter(x=>x.type==="station").reduce((s,x)=>s+(x.ms||0),0); }
function hasTimes(a){ return a.steps&&a.steps.some(x=>x.ms!=null); }
function doneCount(a){ return a.steps.filter(x=>x.ms!=null).length; }
function started(a){ return a.finished || a.running || (a.elapsed||0)>0 || hasTimes(a); }
function liveElapsed(a){ return (a.elapsed||0)+((a.running&&a.startTs)?Date.now()-a.startTs:0); }
function lastSplitMs(a){ const done=doneCount(a); return done>0?a.steps[done-1].ms:null; }
function lastSplitLabel(a){ const done=doneCount(a); return done>0?a.steps[done-1].label:null; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function setupScreen(){
  document.getElementById("app").innerHTML=`<div class="setup">
    <h1>Configura el leaderboard</h1>
    <p>Pega tus credenciales de Firebase en el bloque <code>firebaseConfig</code> de este archivo (las mismas que en <code>cronometro.html</code>).</p>
    <p>Luego abre esta página indicando la sesión, por ejemplo:<br><code>leaderboard.html?s=${esc(SESSION)}</code></p>
    <p style="color:var(--accent)">Sesión actual: <strong>${esc(SESSION)}</strong></p>
  </div>`;
}

function render(state){
  const app=document.getElementById("app");
  const list=(state&&state.athletes?state.athletes:[]).filter(started);
  const finished=list.filter(a=>a.finished).sort((x,y)=>liveElapsed(x)-liveElapsed(y));
  finished.forEach((a,i)=>a._rank=i+1);
  const running=list.filter(a=>!a.finished).sort((x,y)=>doneCount(y)-doneCount(x)||liveElapsed(y)-liveElapsed(x));
  const ordered=[...finished,...running];

  const now=new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const headHtml=`<header>
      <div class="brand"><span class="dot"></span>HYROX</div>
      <div class="meta"><span class="live"><span class="blink"></span>EN VIVO</span><br>Sesión: ${esc(SESSION)} · ${now}</div>
    </header>`;

  if(!ordered.length){
    app.innerHTML=headHtml+`<div class="empty"><div class="big">Esperando tiempos…</div><div>El leaderboard se actualizará en cuanto inicien las carreras.</div></div>
      <footer><span>Cronometraje manual · simulación Hyrox</span><span>Actualización automática</span></footer>`;
    return;
  }

  const rows=ordered.map(a=>{
    const cls=a.finished?("p"+(a._rank<=3?a._rank:"")+" "):"running ";
    const posTxt=a.finished?a._rank:"·";
    const cur=a.finished?"":(a.steps[doneCount(a)]?a.steps[doneCount(a)].label:"");
    const lastLbl=lastSplitLabel(a);
    return `<tr class="${cls}">
      <td class="pos">${posTxt}</td>
      <td><span class="bib">#${a.bib}</span><span class="nm">${esc(a.name)}</span><span class="cat">${esc(a.cat)}</span></td>
      <td class="split"><span class="lbl">Run</span>${fmtShort(runMs(a))}</td>
      <td class="split"><span class="lbl">Estaciones</span>${fmtShort(stationMs(a))}</td>
      <td class="split"><span class="lbl">Avance</span>${doneCount(a)}/16</td>
      <td class="split"><span class="lbl">${lastLbl?esc(lastLbl):"—"}</span>${fmtShort(lastSplitMs(a))}</td>
      <td><div class="total" data-bib="${a.bib}">${fmt(a.finished?liveElapsed(a):liveElapsed(a))}</div>${a.finished?'<span class="badge-fin">Final</span>':'<span class="badge-run">'+esc(cur||"En curso")+'</span>'}</td>
    </tr>`;
  }).join("");

  app.innerHTML=headHtml+`
    <table><thead><tr>
      <th class="num">Pos</th><th>Atleta</th><th>Σ Run</th><th>Σ Estac.</th><th>Avance</th><th>Último split</th><th class="num">Tiempo total</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <footer><span>${finished.length} finalizados · ${running.length} en curso</span><span>Actualización automática</span></footer>`;
}

if(!CONFIGURED){ setupScreen(); }
else{
  Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
  ]).then(([appMod,dbMod])=>{
    const app=appMod.initializeApp(firebaseConfig);
    const db=dbMod.getDatabase(app);
    let lastState={athletes:[]};
    dbMod.onValue(dbMod.ref(db,"sessions/"+SESSION+"/state"),(snap)=>{
      lastState=snap.val()||{athletes:[]};
      render(lastState);
    },(err)=>{ console.error(err); });
    render({athletes:[]});
    setInterval(()=>{
      // actualiza en vivo el tiempo total de atletas en curso, y el reloj de cabecera
      const map={}; (lastState.athletes||[]).forEach(a=>map[a.bib]=a);
      let needsFull=false;
      document.querySelectorAll(".total[data-bib]").forEach(el=>{
        const a=map[parseInt(el.dataset.bib,10)];
        if(a && a.running){ el.textContent=fmt(liveElapsed(a)); }
      });
      // si hay alguien corriendo, re-render completo cada segundo para mover el reloj de cabecera
      if((lastState.athletes||[]).some(a=>a.running||(!a.finished&&((a.elapsed||0)>0)))) { /* el header se actualiza en el próximo onValue/refresh */ }
    },1000);
  }).catch(e=>{ console.error(e); setupScreen(); });
}
</script>
</body>
</html>
